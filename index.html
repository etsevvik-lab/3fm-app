<style>
/* Мобильное приложение внутри Max: липкая шапка, лента карточек, нижнее меню, правка в выезжающей панели */
:root{
  --bg:#f2f3f6; --surface:#ffffff; --surface-2:#f7f8fa; --line:#e3e6ec;
  --fg:#15181e; --muted:#667085; --accent:#2f56d6; --accent-soft:#e7edff; --on-accent:#ffffff;
  --ok:#17905f; --ok-soft:#e3f5ec; --warn:#b7860f; --warn-soft:#fbf1d6; --bad:#c93b3b; --bad-soft:#fbe5e5;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.06);
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1014; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38;
  --fg:#e9ebef; --muted:#97a0ae; --accent:#6f8dff; --accent-soft:#222c4d; --on-accent:#0e1014;
  --ok:#43c08a; --ok-soft:#163327; --warn:#e2b64a; --warn-soft:#3a3118; --bad:#ef7373; --bad-soft:#3d1f1f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1014; --surface:#181b21; --surface-2:#1f232a; --line:#2a2f38;
  --fg:#e9ebef; --muted:#97a0ae; --accent:#6f8dff; --accent-soft:#222c4d; --on-accent:#0e1014;
  --ok:#43c08a; --ok-soft:#163327; --warn:#e2b64a; --warn-soft:#3a3118; --bad:#ef7373; --bad-soft:#3d1f1f;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* служебная полоса прототипа */
.proto{background:var(--accent-soft);color:var(--accent);font-size:12.5px;padding-block:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.proto b{font-weight:600}
.proto select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 6px;font-size:12.5px;color:var(--fg)}

/* шапка */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;display:flex;align-items:center;gap:10px;min-height:52px}
.top h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--fg)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}

main{padding-block:12px 120px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.swatch{width:14px;height:14px;border-radius:4px;border:1px solid var(--line);display:inline-block;flex:none}
.soon{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:2px 6px}

/* шапка заявки */
.req-head{display:grid;gap:10px}
.req-head .t{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px;min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted)}
.kv b{font-size:15px;font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--fg);border-radius:12px;padding:10px 12px;font-size:13.5px}
.alert i{font-style:normal;color:var(--warn);font-weight:700}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 6px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:500}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px}
.tog[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}

/* карточки позиций */
.plist{display:flex;flex-direction:column;gap:8px}
.pos{position:relative;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:11px 12px 11px 16px;display:grid;gap:6px;border:0;text-align:left;width:100%}
.pos::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--ok)}
.pos.c-mid::before{background:var(--warn)}
.pos.c-low::before{background:var(--bad)}
.pos.sel{outline:2px solid var(--accent)}
.pos .l1{display:flex;align-items:baseline;gap:10px}
.pos .n{font-size:12px;color:var(--muted);min-width:34px}
.pos .dim{font-size:16px;font-weight:500}
.pos .qty{font-size:14px;color:var(--muted)}
.pos .sum{margin-left:auto;font-size:14px;font-weight:500}
.pos .l2{display:flex;gap:6px;flex-wrap:wrap}
.pos .why{font-size:12.5px;color:var(--warn)}
.pos .ck{position:absolute;right:10px;top:10px;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--surface)}
.pos.sel .ck{background:var(--accent);border-color:var(--accent)}

/* таблица */
.tablewrap{overflow-x:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface)}
td.r,th.r{text-align:right}
tr.c-mid td:first-child{box-shadow:inset 3px 0 var(--warn)}
tr.c-low td:first-child{box-shadow:inset 3px 0 var(--bad)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel td{background:var(--accent-soft)}
td.ckc,th.ckc{width:34px;padding-right:0}
.tck{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid var(--line);background:var(--surface);vertical-align:middle}
tr.sel .tck{background:var(--accent);border-color:var(--accent)}
.bulk-sec{display:grid;gap:8px;padding:12px;border-radius:12px;background:var(--surface-2)}
.bulk-sec h3{margin:0;font-size:14px;font-weight:600}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);border-radius:10px;padding:10px;font-size:14px}

/* исходник */
.sheet-ph{background:repeating-linear-gradient(0deg,var(--surface) 0 26px,var(--surface-2) 26px 27px);border:1px solid var(--line);border-radius:12px;aspect-ratio:3/4;max-width:100%;display:grid;place-items:center;text-align:center;padding:16px;color:var(--muted);font-size:13px}

/* нижнее меню */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar button{flex:1;border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current="page"]{color:var(--accent)}
.badge{position:relative}
.badge[data-n]::after{content:attr(data-n);position:absolute;top:-4px;right:-10px;background:var(--bad);color:#fff;font-size:10px;border-radius:999px;padding:0 5px;line-height:15px}

/* панель действий заявки */
.actions{position:fixed;left:0;right:0;bottom:calc(56px + env(safe-area-inset-bottom,0px));z-index:24;padding-block:8px;display:flex;gap:8px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;font-size:15px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--on-accent)}
.btn.grow{flex:1}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}

/* выезжающая панель правки */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:40}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.18)}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.form{display:grid;gap:12px}
.f2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12px;color:var(--muted)}
.fld input,.fld select,.fld textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font-size:15px;min-width:0}
.fld textarea{min-height:60px;resize:vertical}
.fld input.num{font-family:var(--f-num)}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.checks label{display:flex;gap:6px;align-items:center}
.crop{border:1px dashed var(--line);border-radius:12px;padding:10px;display:grid;gap:6px;font-size:12.5px;color:var(--muted)}
.crop .strip{height:46px;border-radius:8px;background:repeating-linear-gradient(90deg,var(--surface-2) 0 14px,var(--surface) 14px 16px);display:flex;align-items:center;padding:0 10px;font-family:var(--f-num);color:var(--fg);font-size:14px}
.changed{box-shadow:0 0 0 2px var(--accent-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}

/* общие списки разделов */
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .ttl{font-weight:500}
.h2{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:4px 2px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;border:0;text-align:left}
.tile b{display:block;font-size:24px;font-weight:600}
.tile span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.drawer{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

function newOrder(color){ const k=Math.max(...orderKeys())+1; ORDERS[k]={id:'З-2026-'+String(13+k).padStart(4,'0'),color:color||'уточнить'}; return k; }

/* ===== Расчёт (как формулы ядра) ===== */
const area = p => p.h*p.w*p.qty/1e6;
const drillCount = s => { if(!s) return 0; const t=s.trim().split(/\s+/)[1]||''; return t.split(/[\/\\]/).filter(Boolean).length; };
function calc(p){
  const a=area(p), pr=(PRICE[p.model]||[0,0,0])[Math.max(0,COATS.indexOf(p.coat))];
  const dop=Math.round((p.th===22?800:p.th===25?1000:0)*a + drillCount(p.drill)*p.qty*60);
  return {a,pr,dop,sum:a*pr+dop};
}

/* ===== События ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-open],[data-inner],[data-view],[data-pos],[data-act],[data-more],[data-goto]'); if(!t) return;
  if(t.dataset.tab){S.tab=t.dataset.tab;S.screen=t.dataset.tab==='more'?'':'list';S.select=false;S.sel.clear();return render();}
  if(t.dataset.goto){S.tab=t.dataset.goto;S.screen='list';return render();}
  if(t.dataset.open){S.order=+t.dataset.open;S.screen='req';S.inner='pos';return render();}
  if(t.dataset.inner){S.inner=t.dataset.inner;return render();}
  if(t.dataset.view){S.view=t.dataset.view;return render();}
  if(t.dataset.more){S.screen='more:'+t.dataset.more;return render();}
  if(t.dataset.pos){ if(S.select){const id=+t.dataset.pos;S.sel.has(id)?S.sel.delete(id):S.sel.add(id);return render();} return openEdit(t.dataset.pos); }
  const a=t.dataset.act;
  if(a==='back'){S.screen=S.tab==='more'?'':'list';return render();}
  if(a==='doubt'){S.onlyDoubt=!S.onlyDoubt;return render();}
  if(a==='select'){S.select=!S.select;S.sel.clear();return render();}
  if(a==='selall'){const shown=POS.filter(p=>p.order===S.order&&(!S.onlyDoubt||p.conf!=='h'));
    if(S.sel.size===shown.length) S.sel.clear(); else shown.forEach(p=>S.sel.add(p.id)); return render();}
  if(a==='bulk') return openBulk();
  if(a==='b-move'){let to=$('b-to').value; const sel=selected(); to = to==='new'?newOrder(sel[0]&&sel[0].color):+to;
    const tc=$('b-color').checked; sel.forEach(p=>{log('л'+p.sheet+'·'+p.n,'Заказ',ORDERS[p.order].id,ORDERS[to].id);p.order=to;if(tc&&ORDERS[to].color!=='уточнить')p.color=ORDERS[to].color;p.conf='h';});
    return bulkDone(`Перенесено в ${ORDERS[to].id}: ${sel.length} поз.`);}
  if(a==='b-set'){const k=$('b-field').value, name=BULK_FIELDS[k][0]; let v=$('b-val').value; if(k==='th') v=Number(v);
    const sel=selected(); sel.forEach(p=>{if(String(p[k])!==String(v)){log('л'+p.sheet+'·'+p.n,name,p[k],v);p[k]=v;}});
    return bulkDone(`${name}: изменено у ${sel.length} поз.`);}
  if(a==='b-delask'){ $('b-delwrap').innerHTML=`<div class="confirm">Удалить ${S.sel.size} поз. из заявки? <button class="btn danger" data-act="b-del">Да, удалить</button><button class="btn" data-act="b-delno">Нет</button></div>`; return; }
  if(a==='b-delno'){ $('b-delwrap').innerHTML=`<button class="btn danger" data-act="b-delask">Удалить ${S.sel.size} поз.</button>`; return; }
  if(a==='b-del'){const sel=selected(); sel.forEach(p=>{log('л'+p.sheet+'·'+p.n,'Позиция удалена',`${p.h}×${p.w}×${p.qty}`,'');POS.splice(POS.indexOf(p),1);}); return bulkDone(`Удалено: ${sel.length} поз.`);}
  if(a==='add') return openEdit('new');
  if(a==='close') return closeEdit();
  if(a==='del'){const p=S.editing.p;log('л'+p.sheet+'·'+p.n,'Позиция удалена',`${p.h}×${p.w}×${p.qty}`,'');POS.splice(POS.indexOf(p),1);S.dirty=true;closeEdit();render();return toast('Позиция удалена');}
  if(a==='save'){S.dirty=false;render();return toast('Сохранено. Сводка в боте обновлена');}
  if(a==='ok'){return toast(S.dirty?'Сначала сохраните правки':'Отмечено «Верно». Бот готовит КП');}
});
document.addEventListener('submit',e=>{ if(e.target.id==='ef'){ e.preventDefault(); applyEdit(); }});
$('role').addEventListener('change',e=>{S.role=e.target.value;S.screen='list';S.tab='home';render();});
render();
</script>
